; Copiez ce fichier en config.ini et adaptez-le.

[photos]
; Un ou plusieurs dossiers à analyser (un par ligne, indentés).
; Chemin réseau du NAS (\\NOM-DU-NAS\partage\...) ou lecteur réseau (Z:\Photos).
dossiers =
    \\NAS\photo
; Dossiers à ignorer (morceaux de chemin, un par ligne)
ignorer =
    @eaDir
    #recycle
    .thumbnails
    Lightroom Previews
; Extensions prises en compte
extensions = .jpg .jpeg .png .tif .tiff .heic .webp .dng .cr2 .cr3 .nef .arw .raf .orf .rw2

[site]
; Adresse du site sur o2switch (sans / à la fin)
url = https://photos.mondomaine.fr
; Clé affichée à l'installation du site (page Réglages)
cle_api = COLLER_LA_CLE_ICI

[ia]
; oui / non : analyser les photos avec l'IA locale
active = oui
; ollama ou openai (pour LM Studio, llama.cpp, etc.)
moteur = ollama
url = http://localhost:11434
; RTX 4070 (12 Go) : gemma3:12b est un bon choix. Plus rapide : qwen2.5vl:7b
modele = gemma3:12b
; Taille (en pixels, côté le plus long) de l'image envoyée à l'IA
taille_image = 1024
; Secondes max par photo
delai = 180

[apercus]
; Miniature de la galerie (hauteur max en pixels)
miniature_hauteur = 440
; Aperçu plein écran (côté le plus long, 0 = pas d'aperçu, la miniature sert alors d'aperçu)
apercu_taille = 1600
qualite = 80

[lightroom]
; Optionnel : chemin du catalogue Lightroom (.lrcat) pour récupérer mots-clés, notes,
; étiquettes et légendes même s'ils ne sont pas écrits dans les fichiers.
; Le catalogue est copié puis lu en lecture seule : Lightroom peut rester ouvert.
catalogue =
; Si Lightroom voit le NAS sous un autre chemin que ci-dessus, indiquez la correspondance
; sous la forme  chemin_lightroom => chemin_ci_dessus   (un par ligne)
correspondances =
;    Z:\Photos => \\NAS\photo

[outils]
; Chemin de exiftool.exe s'il n'est pas dans le même dossier que ce script ni dans le PATH
exiftool =
